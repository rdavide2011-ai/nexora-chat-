
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>Nexora Chat — Test notifiche</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; background: #101b20; color: #f5f7f8;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px 24px;
      border-radius: 24px; background: #202e34; text-align: center;
    }
    .logo {
      margin: auto; width: 60px; height: 60px; display: grid;
      place-items: center; border-radius: 18px; background: #078577;
      font-size: 28px; font-weight: bold;
    }
    h1 { font-size: 24px; }
    p { color: #c9dce2; line-height: 1.5; }
    button {
      width: 100%; padding: 15px; margin-top: 10px; border: 0;
      border-radius: 12px; background: #078577; color: white;
      font-weight: bold; font-size: 15px; cursor: pointer;
    }
    button.secondary { background: #344c48; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { overflow-wrap: anywhere; font-size: 13px; margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <div class="logo">N</div>
  <h1>Nexora Chat</h1>
  <p>Gestione e test delle notifiche push.</p>

  <button id="enable">1. Attiva notifiche</button>
  <button id="reset" class="secondary">2. Reimposta sottoscrizione</button>
  <button id="test" class="secondary" disabled>3. Ricevi notifica di test</button>
  <p id="status" role="status">In attesa.</p>
</main>

<script>
"use strict";

const VAPID_PUBLIC_KEY =
  "BEerw_zOGMn7TBC13Ike0xTlXx09tCoLdeE8omauraJ362wgWvy3rhH_GQ6qJ6a1wO9sbqvV3X0W0OF_Hp8d8Uw";

const FUNCTION_URL =
  "https://dycbbhqzpgnnyilzwuwa.supabase.co/functions/v1/schedule-test-notification";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_zYdD5LSAKMFRNk-Yas3Hxg_oogRDb3a";

const statusElement = document.getElementById("status");
const enableButton = document.getElementById("enable");
const resetButton = document.getElementById("reset");
const testButton = document.getElementById("test");

let subscription = null;

function setStatus(message) {
  statusElement.textContent = message;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const raw = atob(base64);
  return Uint8Array.from(raw, character => character.charCodeAt(0));
}

async function getRegistration() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    throw new Error("Questo browser non supporta le notifiche push.");
  }

  if (!window.isSecureContext) {
    throw new Error("Apri il sito tramite HTTPS.");
  }

  await navigator.serviceWorker.register("/service-worker.js");
  return await navigator.serviceWorker.ready;
}

async function enableNotifications() {
  try {
    enableButton.disabled = true;
    setStatus("Attivazione notifiche...");

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error("Permesso notifiche non concesso.");
    }

    const registration = await getRegistration();

    subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }

    testButton.disabled = false;
    setStatus("Notifiche attive. Ora puoi eseguire il test.");
  } catch (error) {
    setStatus("Errore: " + error.message);
  } finally {
    enableButton.disabled = false;
  }
}

async function resetSubscription() {
  try {
    resetButton.disabled = true;
    testButton.disabled = true;
    setStatus("Eliminazione della vecchia sottoscrizione...");

    const registration = await getRegistration();
    const oldSubscription = await registration.pushManager.getSubscription();

    if (oldSubscription) {
      await oldSubscription.unsubscribe();
    }

    subscription = null;

    if (Notification.permission !== "granted") {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        throw new Error("Permesso notifiche non concesso.");
      }
    }

    subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    testButton.disabled = false;
    setStatus("Nuova sottoscrizione creata. Premi il pulsante di test.");
  } catch (error) {
    setStatus("Errore: " + error.message);
  } finally {
    resetButton.disabled = false;
  }
}

async function sendTestNotification() {
  try {
    testButton.disabled = true;
    setStatus("Invio della notifica...");

    const registration = await getRegistration();

    subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
      throw new Error("Nessuna sottoscrizione. Premi prima Attiva notifiche.");
    }

    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        subscription: subscription.toJSON()
      })
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status + ": " +
        (result.error || result.details || "Errore del server")
      );
    }

    setStatus("Richiesta inviata. " + (result.message || ""));
  } catch (error) {
    setStatus("Errore: " + error.message);
  } finally {
    testButton.disabled = false;
  }
}

enableButton.addEventListener("click", enableNotifications);
resetButton.addEventListener("click", resetSubscription);
testButton.addEventListener("click", sendTestNotification);
</script>
</body>
</html>
