
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexora Chat">
  <title>Nexora Chat - Test notifiche</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #e9edef;
      color: #172126;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 12px 45px #00000012;
      text-align: center;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #087e70;
      color: white;
      font-size: 30px;
      font-weight: 800;
    }

    h1 { margin: 0 0 12px; font-size: 25px; }

    p {
      color: #667781;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #087e70;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #e2f1ee;
      color: #075e54;
    }

    button:disabled { opacity: .5; cursor: wait; }

    #status {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #111b21; color: #e9edef; }
      .card { background: #202c33; }
      p { color: #b7c4ca; }
      button.secondary { background: #304943; color: #d9fff5; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">N</div>
    <h1>Nexora Chat</h1>
    <p>
      Test delle notifiche push su iPhone.
      Attiva le notifiche e poi avvia il test.
    </p>

    <button id="enable">1. Attiva le notifiche</button>
    <button id="test" class="secondary" disabled>
      2. Ricevi notifica di test
    </button>

    <p id="status" role="status" aria-live="polite">
      In attesa di configurazione.
    </p>
  </main>

  <script>
    "use strict";

    const VAPID_PUBLIC_KEY =
      "BBGKNgCsP3cgIVOE0PLMYydYRPFk4Q5uaGb13IpQ-JnCCmpgMWOmt2cUB4zJkleKYqGuwaY1nmyihwp6sJwMcIU";

    const FUNCTION_URL =
      "https://dycbbhqzpgnnyilzwuwa.supabase.co/functions/v1/schedule-test-notification";

    const statusElement = document.getElementById("status");
    const enableButton = document.getElementById("enable");
    const testButton = document.getElementById("test");

    let subscription = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function decodeVapidKey(key) {
      const padded = key + "=".repeat((4 - key.length % 4) % 4);
      const base64 = padded.replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);

      return Uint8Array.from(raw, char => char.charCodeAt(0));
    }

    async function enableNotifications() {
      if (!("serviceWorker" in navigator) ||
          !("PushManager" in window) ||
          !("Notification" in window)) {
        throw new Error(
          "Notifiche non supportate. Apri Nexora dalla schermata Home su iPhone."
        );
      }

      if (!window.isSecureContext) {
        throw new Error("Il sito deve essere aperto tramite HTTPS.");
      }

      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        throw new Error(
          "Permesso negato. Abilita le notifiche nelle impostazioni dell'iPhone."
        );
      }

      const registration = await navigator.serviceWorker.register(
        "/service-worker.js",
        { scope: "/" }
      );

      await navigator.serviceWorker.ready;

      subscription = await registration.pushManager.getSubscription();

      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: decodeVapidKey(VAPID_PUBLIC_KEY)
        });
      }

      testButton.disabled = false;
      setStatus("Notifiche attive. Puoi avviare il test.");
    }

    enableButton.addEventListener("click", async () => {
      enableButton.disabled = true;
      setStatus("Attivazione delle notifiche...");

      try {
        await enableNotifications();
      } catch (error) {
        setStatus("Errore: " + error.message);
      } finally {
        enableButton.disabled = false;
      }
    });

    testButton.addEventListener("click", async () => {
      testButton.disabled = true;

      try {
        if (!subscription) {
          const registration = await navigator.serviceWorker.ready;
          subscription = await registration.pushManager.getSubscription();
        }

        if (!subscription) {
          throw new Error("Attiva prima le notifiche.");
        }

        setStatus(
          "Richiesta inviata al server. Puoi chiudere la web app e attendere."
        );

        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subscription: subscription.toJSON()
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Invio non riuscito.");
        }

        setStatus("Server: notifica inviata. Controlla l'iPhone.");
      } catch (error) {
        setStatus("Errore: " + error.message);
      } finally {
        testButton.disabled = false;
      }
    });
  </script>
</body>
</html>
